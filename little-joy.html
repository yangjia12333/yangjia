<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小团子 · 谁都别惹我</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 30%, #232538 0%, #141522 55%, #0a0a11 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景里冷冷的光点，懒得闪 */
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #aeb6d4;
    animation: twinkle var(--dur, 6s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0.35;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.08; }
    50%      { opacity: 0.45; }
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 42px;
    z-index: 2;
  }

  /* 小团子本体 —— 一脸不高兴的灰紫色 */
  .blob {
    position: relative;
    width: 200px;
    height: 180px;
    border-radius: 50% 50% 48% 52% / 56% 54% 46% 44%;
    background: radial-gradient(circle at 35% 30%, #d0cbdd 0%, #aaa3c0 45%, #8a83a6 80%, #6b6488 100%);
    box-shadow:
      0 0 48px rgba(140, 130, 180, 0.30),
      0 0 100px rgba(110, 100, 155, 0.16),
      inset -16px -20px 38px rgba(78, 70, 108, 0.42),
      inset 16px 18px 38px rgba(255, 255, 255, 0.32);
    animation: idle-sway 4.4s ease-in-out infinite;
    transition: transform 0.15s ease-out;
    transform-origin: center bottom;
  }
  /* 不耐烦的晃动，末尾还“哼”一下 */
  @keyframes idle-sway {
    0%   { transform: translateY(0) rotate(-1deg) scale(1, 1); }
    35%  { transform: translateY(-7px) rotate(1.2deg) scale(1.01, 0.99); }
    55%  { transform: translateY(0) rotate(-0.6deg) scale(1, 1); }
    70%  { transform: translateY(0) rotate(0.4deg) scale(1.05, 0.95); }
    78%  { transform: translateY(0) rotate(-0.4deg) scale(0.99, 1.01); }
    100% { transform: translateY(0) rotate(-1deg) scale(1, 1); }
  }

  /* 被点：一整个不爽，甩头摇头 */
  .blob.grump { animation: grump 0.62s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes grump {
    0%   { transform: translateY(0) rotate(0) scale(1, 1); }
    12%  { transform: translateY(0) rotate(0) scale(1.12, 0.88); }
    28%  { transform: translate(-12px, 3px) rotate(-9deg) scale(1.02, 0.98); }
    46%  { transform: translate(12px, 3px) rotate(9deg) scale(1.02, 0.98); }
    64%  { transform: translate(-9px, 2px) rotate(-6deg) scale(1.01, 0.99); }
    82%  { transform: translate(7px, 1px) rotate(5deg) scale(1.01, 0.99); }
    100% { transform: translateY(0) rotate(0) scale(1, 1); }
  }

  /* 眉毛：往中间压的倒八 */
  .brows { position: absolute; top: 44px; left: 0; width: 100%; }
  .brow {
    position: absolute;
    width: 30px; height: 7px;
    background: #2f2b40;
    border-radius: 5px;
    transition: transform 0.15s ease;
  }
  .brow.l { left: 44px;  transform: rotate(20deg); }
  .brow.r { right: 44px; transform: rotate(-20deg); }
  .blob.annoyed .brow.l { transform: rotate(30deg) translate(1px, 3px); }
  .blob.annoyed .brow.r { transform: rotate(-30deg) translate(-1px, 3px); }

  /* 眼睛：半耷拉着，很不屑 */
  .eyes { position: absolute; top: 64px; left: 0; width: 100%; display: flex; justify-content: center; gap: 46px; }
  .eye {
    position: relative;
    width: 34px; height: 20px;
    background: #e9e6f0;
    border-radius: 5px 5px 18px 18px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 1px;
    overflow: hidden;
    transition: height 0.15s ease;
  }
  .pupil {
    width: 12px; height: 12px;
    background: #2f2b40;
    border-radius: 50%;
    transition: transform 0.15s ease-out;
  }
  .blob.annoyed .eye { height: 13px; }

  /* 头顶冒的火花 */
  .vein {
    position: absolute; top: 12px; right: 32px;
    width: 26px; height: 26px;
    opacity: 0.9;
    animation: veinPulse 1.6s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes veinPulse {
    0%, 100% { transform: scale(1); opacity: 0.75; }
    50%      { transform: scale(1.18); opacity: 1; }
  }
  .blob.annoyed .vein { animation-duration: 0.45s; }

  /* 瘪着的嘴 */
  .mouth {
    position: absolute; left: 50%; top: 104px; transform: translateX(-50%);
    width: 30px; height: 11px;
    border: 3.5px solid #2f2b40;
    border-bottom: none;
    border-radius: 30px 30px 0 0;
    transition: all 0.15s ease;
  }
  .blob.annoyed .mouth { width: 24px; height: 8px; border-width: 4.5px; }

  /* 影子 */
  .shadow {
    position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 22px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.5), transparent 70%);
    animation: shadowScale 4.4s ease-in-out infinite;
  }
  @keyframes shadowScale {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
    50%      { transform: translateX(-50%) scale(0.9); opacity: 0.4; }
  }

  /* 被点后往外蹦的不爽符号 */
  .floaty-bit {
    position: absolute;
    pointer-events: none;
    animation: burst 0.9s ease-out forwards;
    will-change: transform, opacity;
  }
  .puff {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 38%, rgba(255,255,255,0.92), rgba(205,206,222,0.12) 70%);
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(0.3); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }

  /* 提示文字 */
  .hint {
    color: #b9bedd;
    font-size: 15px;
    letter-spacing: 1.5px;
    opacity: 0.75;
    transition: opacity 0.4s ease;
    text-align: center;
    line-height: 1.9;
  }
  .hint b { color: #d98b8b; font-weight: 600; }

  /* 团子的定位容器（让气泡挂在它头顶） */
  .blob-wrap { position: relative; }

  /* 弹出的没好气的话 —— 挂在团子头顶的对话气泡 */
  .message {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 24px);
    transform: translateX(-50%) scale(0.8) translateY(10px);
    width: max-content;
    max-width: min(82vw, 520px);
    padding: 22px 30px;
    border-radius: 20px;
    background: rgba(236, 236, 243, 0.98);
    color: #2c2937;
    font-size: clamp(17px, 2.2vw, 24px);
    font-weight: 600;
    text-align: center;
    line-height: 1.7;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(120,120,160,0.25) inset;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
    z-index: 10;
  }
  /* 小尖角，指向下面的团子 */
  .message::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    border: 13px solid transparent;
    border-top-color: rgba(236, 236, 243, 0.98);
    margin-top: -2px;
  }
  .message.show { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="stage">
   <div class="blob-wrap">
    <div class="message" id="message"></div>
    <div class="blob" id="blob">
      <div class="brows">
        <div class="brow l"></div>
        <div class="brow r"></div>
      </div>
      <div class="eyes">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
      </div>
      <svg class="vein" viewBox="0 0 40 40" fill="none"
           stroke="#e05252" stroke-width="4.5"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="20" y1="20" x2="20" y2="4"/>
        <line x1="20" y1="20" x2="33" y2="11"/>
        <line x1="20" y1="20" x2="33" y2="29"/>
        <line x1="20" y1="20" x2="20" y2="36"/>
        <line x1="20" y1="20" x2="7" y2="29"/>
        <line x1="20" y1="20" x2="7" y2="11"/>
      </svg>
      <div class="mouth"></div>
      <div class="shadow"></div>
    </div>
   </div>
    <div class="hint" id="hint">看什么看。<br />……别拿手指戳<b>我</b>。</div>
  </div>

<script>
  const blob = document.getElementById('blob');
  const hint = document.getElementById('hint');
  const messageEl = document.getElementById('message');
  const starsWrap = document.getElementById('stars');

  /* —— 背景冷光点 —— */
  (function makeStars() {
    const n = 45;
    let html = '';
    for (let i = 0; i < n; i++) {
      const size = (Math.random() * 2 + 1).toFixed(1);
      html += `<div class="star" style="
        left:${(Math.random()*100).toFixed(2)}%;
        top:${(Math.random()*100).toFixed(2)}%;
        width:${size}px; height:${size}px;
        --dur:${(Math.random()*5+4).toFixed(1)}s;
        --delay:${(Math.random()*6).toFixed(1)}s;"></div>`;
    }
    starsWrap.innerHTML = html;
  })();

  /* —— 眼睛躲着鼠标：越靠近，越往旁边撇，还带点俯视 —— */
  const pupils = document.querySelectorAll('.pupil');
  document.addEventListener('mousemove', (e) => {
    const rect = blob.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const ang = Math.atan2(e.clientY - cy, e.clientX - cx);
    const dist = Math.min(7, Math.hypot(e.clientX - cx, e.clientY - cy) / 30);
    // 往反方向躲，并稍稍往下看（不屑）
    const x = -Math.cos(ang) * dist;
    const y = -Math.sin(ang) * dist * 0.5 + 2;
    pupils.forEach(p => { p.style.transform = `translate(${x}px, ${y}px)`; });
  });

  /* —— 没好气的话 —— */
  const messages = [
    "……干嘛。",
    "不要碰我。",
    "烦。",
    "哼。",
    "谁准你点我的。",
    "我现在不想理任何人。",
    "你怎么还没走。",
    "再点一下试试看。",
    "……哦。",
    "无语。",
    "就你事多。",
    "离我远点。",
    "手拿开。",
    "你是闲得慌吗。"
  ];
  let lastIndex = -1;

  /* —— 点一下，甩头冒火 —— */
  const SPARK = `<svg viewBox="0 0 40 40" width="100%" height="100%" fill="none"
      stroke="#e05252" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="20" y1="20" x2="20" y2="4"/>
      <line x1="20" y1="20" x2="33" y2="11"/>
      <line x1="20" y1="20" x2="33" y2="29"/>
      <line x1="20" y1="20" x2="20" y2="36"/>
      <line x1="20" y1="20" x2="7" y2="29"/>
      <line x1="20" y1="20" x2="7" y2="11"/>
    </svg>`;
  let msgTimer = null;

  function grumpReaction() {
    // 甩头摇头
    blob.classList.remove('grump');
    void blob.offsetWidth;
    blob.classList.add('grump');

    // 加深臭脸
    blob.classList.add('annoyed');
    clearTimeout(blob._annoyTimer);
    blob._annoyTimer = setTimeout(() => blob.classList.remove('annoyed'), 900);

    // 往外蹦几个不爽符号
    const rect = blob.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;
    for (let i = 0; i < 9; i++) {
      const bit = document.createElement('div');
      bit.className = 'floaty-bit';
      bit.innerHTML = Math.random() < 0.7 ? SPARK : '<div class="puff"></div>';
      const sz = 14 + Math.random() * 14;
      bit.style.width = sz + 'px';
      bit.style.height = sz + 'px';
      bit.style.left = (originX + (Math.random() - 0.5) * 90) + 'px';
      bit.style.top  = (originY + (Math.random() - 0.5) * 60) + 'px';
      bit.style.setProperty('--dx', ((Math.random() - 0.5) * 220).toFixed(0) + 'px');
      bit.style.setProperty('--dy', (-30 - Math.random() * 90).toFixed(0) + 'px');
      bit.style.setProperty('--rot', ((Math.random() - 0.5) * 160).toFixed(0) + 'deg');
      document.body.appendChild(bit);
      setTimeout(() => bit.remove(), 1000);
    }

    // 甩一句没好气的话
    let idx;
    do { idx = Math.floor(Math.random() * messages.length); }
    while (idx === lastIndex && messages.length > 1);
    lastIndex = idx;

    messageEl.textContent = messages[idx];
    messageEl.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => messageEl.classList.remove('show'), 2000);

    hint.style.opacity = '0';
  }

  /* 甩完头，恢复继续不耐烦地晃 */
  blob.addEventListener('animationend', (e) => {
    if (e.animationName === 'grump') blob.classList.remove('grump');
  });

  document.addEventListener('pointerdown', (e) => {
    grumpReaction();
  });

  // 键盘空格 / 回车也能惹它烦
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      grumpReaction();
    }
  });
</script>
</body>
</html>
